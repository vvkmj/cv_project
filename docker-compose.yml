version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traffic_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./evidence:/app/evidence
      - ./uploads:/app/uploads
      - ./sample_media:/app/sample_media
      - ./ml/weights:/app/ml/weights
      - ./traffic_system.db:/app/traffic_system.db
    environment:
      - DATABASE_URL=sqlite:///./traffic_system.db
      - DETECTION_CONFIDENCE=0.35
      - HELMET_CONFIDENCE=0.50
      - DEFAULT_PASSENGER_LIMIT=2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic_frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

